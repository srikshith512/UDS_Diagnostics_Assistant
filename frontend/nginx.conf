server {
  listen 80;
  client_max_body_size 2m;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 180s;   # local LLM calls can be slow on CPU
  }
  location / { try_files $uri /index.html; }
}
